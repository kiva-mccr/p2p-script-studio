name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write # the speech models' zip as a release asset (SE-5): over GitHub Pages' 100 MB a file
  pages: write
  id-token: write
  attestations: write # signed build attestations (SE-10, SE-7): the sealed file, the models' zip, the live files' list

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build # the website, then the sealed file (SE-10) beside it
        env: { LIVE_BUILD: '1' }
      # The speech models (SE-5), pinned in src/lib/models.lock.json: each file's SHA-256 is checked, then they go beside
      # the website and into one zip for the sealed app. Kept between runs, so Hugging Face is asked only for a new pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: .models-cache, key: "models-${{ hashFiles('src/lib/models.lock.json') }}" }
      - run: node --experimental-strip-types --no-warnings scripts/models.ts
      - name: The models' zip as a release (made once for each pin)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag=$(node -p "require('./dist/speech-models.json').tag")
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" .models-cache/speech-models.zip \
            --latest=false --title "Speech models ($tag)" --notes "The sealed app's speech models, pinned in src/lib/models.lock.json. Add it in the sealed app's Settings."
      # The SHA-256 of every file published (SE-7), signed below with the rest: anyone can check what the site serves.
      - run: node --experimental-strip-types --no-warnings scripts/hashes.ts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/script-studio-sealed.html
            .models-cache/speech-models.zip
            dist/sha256sums.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
