name: Tests

# Every pull request runs the tests, even a docs-only one: the main branch's ruleset requires this check, and a
# skipped check would leave the pull request waiting forever. Pushes to main still skip docs-only changes.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # SE-2: no known vulnerability in what ships to browsers (dev tools aren't shipped). A new advisory fails every
      # pull request until the package is updated, or overridden in package.json when it never reaches the browser.
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The app's own font (Inter), so a test that measures the top bar sees what the app is drawn for (AP-16).
      - run: sudo apt-get install -y --no-install-recommends fonts-inter
      - run: npm run e2e
