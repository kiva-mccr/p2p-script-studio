name: Pin the speech models

# SE-5: prints a new src/lib/models.lock.json, the speech models' latest revisions and their files' SHA-256, to review
# and commit by hand. Run by hand from the Actions tab (this container can't reach Hugging Face).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --experimental-strip-types --no-warnings scripts/models.ts --pin
